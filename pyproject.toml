[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpwn"
version = "0.2.0"
description = "Security scanner for MCP (Model Context Protocol) servers"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Robert Ressl", email = "rr@canus.ch" },
]
keywords = ["mcp", "security", "scanner", "penetration-testing", "ai-security", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.0.0",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
mcpwn = "mcpwn.cli:main"

[project.urls]
Homepage = "https://github.com/ressl/mcpwn"
Repository = "https://github.com/ressl/mcpwn"
Issues = "https://github.com/ressl/mcpwn/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true